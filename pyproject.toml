[project]
name = "pr-sentinel"
version = "0.1.0"
description = "AI 代码评审官：PR 自动审查 · 证据化评论 · 历史 bug 可验证评测"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "langfuse>=3.0",
    "ruff>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "scripts/run_worker.py"]
    restart: unless-stopped
